name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
        working-directory: backend

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy: scrive il nuovo digest in faccus/dymista-homelab; Portainer (GitOps polling)
  # rideploya lo stack firefly-ingest quando vede il commit.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deploy
      cancel-in-progress: false
    env:
      HAS_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY != '' }}
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - name: Deploy key presente?
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Secret HOMELAB_DEPLOY_KEY non configurato, deploy saltato"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          repository: faccus/dymista-homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          path: homelab
      - name: Aggiorna il digest nello stack
        if: env.HAS_KEY == 'true'
        working-directory: homelab
        run: |
          f=stacks/firefly-ingest/compose.yml
          sed -i -E "s#^([[:space:]]*image: )ghcr\.io/faccus/firefly-ingest@sha256:[0-9a-f]{64}\$#\1${IMAGE}#" "$f"
          grep -qF "image: ${IMAGE}" "$f" || { echo "::error::riga image non trovata in $f"; exit 1; }
          if git diff --quiet; then echo "Digest già aggiornato"; exit 0; fi
          git config user.name "firefly-ingest CI"
          git config user.email "firefly-ingest-ci@users.noreply.github.com"
          git commit -qam "Deploy firefly-ingest ${GITHUB_SHA::7}" -m "Image ${IMAGE}" -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
